name: Verify Intel macOS package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; leave empty to build and verify without publishing
        required: false
        default: ''
      reuse_run:
        description: Verified native build artifact run ID; empty creates a new build
        required: false
        default: ''
      publish_run:
        description: Upload an already tested Intel artifact run without rebuilding
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.publish_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            bundle: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify version and tagged application source
        if: inputs.tag != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          # Only documentation, Mac licensing collection and release QA may differ from the app tag.
          git diff --exit-code "$RELEASE_TAG" -- . ':!README.md' ':!test' ':!scripts/third-party-notices.cjs'
      - run: npm ci
      - name: Test DMG update controller
        run: node --test test/mac-dmg-update.test.cjs test/font-downloads.test.cjs
      - name: Build native DMG and ZIP (ad-hoc signature, no notarization)
        if: inputs.reuse_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node -e "console.log(require('electron'))"; then break; fi
            test "$attempt" -lt 5
            sleep 5
          done
          # Fetch the pinned builder tool separately so transient HTTP failures can retry.
          TOOL_DIR="$RUNNER_TEMP/tugou-dmgbuild"
          mkdir -p "$TOOL_DIR"
          gh api repos/electron-userland/electron-builder-binaries/releases/assets/436378863 -H 'Accept: application/octet-stream' > "$TOOL_DIR/tool.tar.gz"
          echo "1664972f9cc2d6e8fce3b63e42cd30078aff602669c5856939c4519921200433  $TOOL_DIR/tool.tar.gz" | shasum -a 256 --check
          tar -xzf "$TOOL_DIR/tool.tar.gz" --strip-components=1 -C "$TOOL_DIR"
          export CUSTOM_DMGBUILD_PATH="$TOOL_DIR/dmgbuild"
          npm run dist:mac -- dmg zip --${{ matrix.arch }} --publish never -c.mac.identity=- -c.electronDist=node_modules/electron/dist
      - name: Restore the same native packages for QA
        if: inputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" --name mac-built-x64 --dir release
          (cd release && shasum -a 256 --check SHA256SUMS-built.txt)
          tar -xzf release/runtime.tgz
          mkdir -p release/mac
          unzip -q release/tugou-*-mac-x64.zip -d release/mac
          mkdir -p dist
          node -e "require('fs').writeFileSync('dist/THIRD_PARTY_NOTICES.txt',require('@electron/asar').extractFile('release/mac/Tugou.app/Contents/Resources/app.asar','dist/THIRD_PARTY_NOTICES.txt'))"
      - name: Verify native binaries and bundle signature
        run: |
          BUNDLE="release/${{ matrix.bundle }}/Tugou.app"
          grep -q '@img/sharp-libvips-darwin-' dist/THIRD_PARTY_NOTICES.txt
          grep -q 'any later version' dist/THIRD_PARTY_NOTICES.txt
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$BUNDLE/Contents/Info.plist")" = "$(node -p "require('./package.json').version")"
          file "$BUNDLE/Contents/MacOS/Tugou"
          lipo -archs "$BUNDLE/Contents/MacOS/Tugou" | grep -x '${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}'
          codesign --verify --deep --strict "$BUNDLE"
          hdiutil verify release/*.dmg
          unzip -tq release/*.zip
      - name: Retain verified native build for subsequent QA
        if: inputs.reuse_run == ''
        run: |
          tar -czf release/runtime.tgz node_modules/electron/dist node_modules/electron/path.txt
          (cd release && shasum -a 256 *.dmg *.zip runtime.tgz > SHA256SUMS-built.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.reuse_run == ''
        with:
          name: mac-built-x64
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/runtime.tgz
            app/release/SHA256SUMS-built.txt
          compression-level: 0
          retention-days: 3
      - name: Test packaged PPT MCP, element effects, PSD and photo editing
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
          TUGOU_MCP_BINARY: release/${{ matrix.bundle }}/Tugou.app/Contents/MacOS/Tugou
        run: |
          node_modules/.bin/electron test/presentation-mcp-desktop.cjs
          node_modules/.bin/electron test/element-effects-desktop.cjs
          node_modules/.bin/electron test/psd-desktop.cjs
          node_modules/.bin/electron test/photo-desktop.cjs
      - name: Test packaged PPT zoom and canvas panning
        id: ppt_zoom
        continue-on-error: true
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: node_modules/.bin/electron test/ppt-zoom-desktop.cjs
      - name: Test packaged pixel corners
        id: ppt_radius
        continue-on-error: true
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: node_modules/.bin/electron test/ppt-radius-desktop.cjs
      - name: Test packaged full MCP creative commands
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
          TUGOU_MCP_BINARY: release/${{ matrix.bundle }}/Tugou.app/Contents/MacOS/Tugou
          TUGOU_TEST_OUTPUT: test-results/mcp-regression
        run: |
          sudo purge
          node_modules/.bin/electron test/automation-editing-desktop.cjs
          sudo purge
          node_modules/.bin/electron test/automation-desktop.cjs
      - name: Test packaged canvas tools, local generation regions and material deletion
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
          TUGOU_MCP_BINARY: release/${{ matrix.bundle }}/Tugou.app/Contents/MacOS/Tugou
        run: |
          sudo purge
          node_modules/.bin/electron test/canvas-all-tools-desktop.cjs
          sudo purge
          node_modules/.bin/electron test/canvas-local-edit-desktop.cjs
          sudo purge
          node_modules/.bin/electron test/materials-context-desktop.cjs
      - name: Test packaged renderer, native image module, fonts, editing and MCP
        env:
          TUGOU_MAC_QA_BUNDLE: release/${{ matrix.bundle }}/Tugou.app
        run: node_modules/.bin/electron test/mac-release-desktop.cjs
      - name: Test packaged cloud fonts, progress, weights and offline export
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
          TUGOU_FONT_QA_OUT: test-results/font-downloads-native
        run: node_modules/.bin/electron test/font-downloads-desktop.cjs
      - name: Test packaged pages and confirmation buttons
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
          TUGOU_PAGE_QA_OUT: test-results/pages-native
        run: node_modules/.bin/electron test/pages-desktop.cjs
      - name: Test packaged image concurrency, settings and process restart
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: |
          node_modules/.bin/electron test/generation-concurrency-desktop.cjs
          node_modules/.bin/electron test/generation-concurrency-desktop.cjs --reopen
      - name: Test packaged release notes, safe links and update prompts
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: node_modules/.bin/electron test/update-prompt-desktop.cjs
      - name: Test packaged image times, empty composition, inspector and save locations
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: |
          node_modules/.bin/electron test/asset-time-desktop.cjs
          node_modules/.bin/electron test/empty-composition-desktop.cjs
          node_modules/.bin/electron test/generation-inspector-desktop.cjs
          node_modules/.bin/electron test/image-save-desktop.cjs
          node_modules/.bin/electron test/image-save-desktop.cjs --reopen
      - name: Test GIF codec and packaged animation, sliders and canvas panning
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: |
          node --test test/gif.test.cjs
          node_modules/.bin/electron test/gif-desktop.cjs
          node_modules/.bin/electron test/canvas-pan-desktop.cjs
      - name: Launch actual packaged executable with isolated profile
        run: |
          # macOS /var is a symlink; the app deliberately rejects linked data paths.
          export TUGOU_DATA_DIR="$(node -e "const fs=require('fs'),os=require('os'),path=require('path');console.log(fs.realpathSync(fs.mkdtempSync(path.join(os.tmpdir(),'tugou-release-'))))")"
          "release/${{ matrix.bundle }}/Tugou.app/Contents/MacOS/Tugou" --mcp-enable > test-results/mac-release/launch.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          node <<'JS'
          const {bridge}=require('./core/mcp.cjs');
          const path=require('node:path');
          (async()=>{let last;const end=Date.now()+90000;while(Date.now()<end){try{const r=await bridge(path.join(process.env.TUGOU_DATA_DIR,'mcp-session.json'),'get_state',{},{reconnectTimeoutMs:0,signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error(JSON.stringify(r.error));console.log('Packaged executable MCP ready:',r.value.capabilities.commands);return;}catch(e){last=e;await new Promise(r=>setTimeout(r,1000));}}throw last;})().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Test packaged comparison modes and synchronized navigation
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
        run: node_modules/.bin/electron test/comparison-view-desktop.cjs
      - name: Test packaged canvas image comparison and prompt previews
        env:
          TUGOU_TEST_APP: release/${{ matrix.bundle }}/Tugou.app/Contents/Resources/app.asar/desktop-main.cjs
          TUGOU_MCP_BINARY: release/${{ matrix.bundle }}/Tugou.app/Contents/MacOS/Tugou
        run: |
          node_modules/.bin/electron test/canvas-image-compare-desktop.cjs
          node_modules/.bin/electron test/prompt-hover-desktop.cjs
      - name: Verify full DMG download and native mount
        env:
          TUGOU_MAC_QA_BUNDLE: release/${{ matrix.bundle }}/Tugou.app
        run: node_modules/.bin/electron test/mac-dmg-native.cjs
      - name: Require both PPT interaction checks to pass before publishing
        if: steps.ppt_zoom.outcome != 'success' || steps.ppt_radius.outcome != 'success'
        run: exit 1
      - name: Prepare checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ matrix.arch }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/SHA256SUMS-mac-*.txt
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-evidence-${{ matrix.arch }}
          path: |
            app/test-results/presentation-mcp/*.json
            app/test-results/presentation-mcp/*.png
            app/test-results/ppt-zoom/*.json
            app/test-results/ppt-zoom/*.png
            app/test-results/ppt-radius/*.json
            app/test-results/ppt-radius/*.png
            app/test-results/element-effects/*.json
            app/test-results/element-effects/*.png
            app/test-results/psd/*.json
            app/test-results/psd/*.png
            app/test-results/photo-retouch/*.json
            app/test-results/photo-retouch/*.png
            app/test-results/canvas-all-tools/*.json
            app/test-results/canvas-all-tools/*.png
            app/test-results/canvas-local-edit/*.json
            app/test-results/canvas-local-edit/*.png
            app/test-results/materials-context/*.json
            app/test-results/materials-context/*.png
            app/test-results/mcp-full/*.json
            app/test-results/mcp-regression/*.json
            app/test-results/gif/*.json
            app/test-results/gif/*.png
            app/test-results/canvas-pan/*.json
            app/test-results/canvas-pan/*.png
            app/test-results/asset-time/*.json
            app/test-results/asset-time/*.png
            app/test-results/empty-composition/*.json
            app/test-results/empty-composition/*.png
            app/test-results/generation-inspector/*.json
            app/test-results/generation-inspector/*.png
            app/test-results/image-save/*.json
            app/test-results/image-save/*.png
            app/test-results/mac-release/*.json
            app/test-results/mac-release/*.png
            app/test-results/mac-release/*.log
            app/test-results/font-downloads-native/*.json
            app/test-results/font-downloads-native/*.png
            app/test-results/pages-native/*.json
            app/test-results/pages-native/*.png
            app/test-results/comparison-view/*.json
            app/test-results/comparison-view/*.png
            app/test-results/canvas-image-compare/*.json
            app/test-results/canvas-image-compare/*.png
            app/test-results/prompt-hover/*.json
            app/test-results/prompt-hover/*.png
            app/test-results/generation-concurrency/*.json
            app/test-results/generation-concurrency/*.png
            app/test-results/update-prompt/*.json
            app/test-results/update-prompt/*.png
          retention-days: 14
  publish_verified:
    if: inputs.publish_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: ${{ inputs.publish_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Retrieve and validate the tested native packages and all reports
        run: |
          test "$RELEASE_TAG" = v0.8.17
          [[ "$QA_RUN" =~ ^[0-9]+$ ]]
          gh run view "$QA_RUN" --repo "$GITHUB_REPOSITORY" --json jobs,headSha > run.json
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name mac-x64 --dir packages
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name mac-evidence-x64 --dir evidence
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease > release.json
          python3 <<'PY'
          import hashlib,json,pathlib
          run=json.load(open('run.json'))
          failed=[s for j in run['jobs'] for s in j['steps'] if s['conclusion']=='failure']
          assert len(failed)==1 and failed[0]['number']==30 and 'upload-artifact@' in failed[0]['name'],failed
          reports=[json.loads(p.read_text()) for p in pathlib.Path('evidence').rglob('*.json')]
          assert len(reports)==28 and sum(len(r['checks']) for r in reports)==923
          assert all(not r.get('error') and not r.get('failure') and not r.get('errors') for r in reports)
          native=json.load(open('evidence/mac-release/dmg-native.json'))
          assert native['passed'] and native['arch']=='x64' and native['version']=='0.8.17'
          release=json.load(open('release.json'))
          assert release['tagName']=='v0.8.17' and not release['isDraft'] and not release['isPrerelease']
          expected={'tugou-0.8.17-mac-x64.dmg','tugou-0.8.17-mac-x64.zip'}
          hashes=[]
          for line in pathlib.Path('packages/SHA256SUMS-mac-x64.txt').read_text().splitlines():
              wanted,name=line.split()
              assert name in expected
              file=pathlib.Path('packages')/name
              h=hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1048576),b''):h.update(chunk)
              assert h.hexdigest()==wanted
              hashes.append({'name':name,'sha256':wanted,'bytes':file.stat().st_size})
          assert {h['name'] for h in hashes}==expected
          assert native['sha256']==next(h['sha256'] for h in hashes if h['name'].endswith('.dmg'))
          print(json.dumps({'qaRun':run,'reportCount':28,'checks':923,'packages':hashes}))
          PY
      - name: Publish the verified Intel package files
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" packages/tugou-0.8.17-mac-x64.dmg packages/tugou-0.8.17-mac-x64.zip packages/SHA256SUMS-mac-x64.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[]|{name,size,digest,state}]'
